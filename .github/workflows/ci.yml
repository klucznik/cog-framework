name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, dom, simplexml
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint
        run: find src codegen -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Load test schema
        run: mysql --host=127.0.0.1 --user=root < src/Test/cog_test.sql

      - name: Run test suite
        run: composer test
        env:
          COG_TEST_DB_SERVER: 127.0.0.1
          COG_TEST_DB_NAME: cog_test
          COG_TEST_DB_USER: root
          COG_TEST_DB_PASSWORD: ''
